name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listening to both
  # ran every gate twice on each PR commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Content typography lint
        run: bun run lint:typography

      # The text pipeline and the lint rules. Both are regex-heavy and both are
      # easy to break in a way no page reveals until the wrong viewport width.
      - name: Unit tests
        run: bun test

      # The woff2 files, fonts.css, the preload module and data/fonts.json all
      # have to describe the same fonts. A stale hash is a silent 404 that falls
      # back to Arial and looks fine until you look at a spec column.
      - name: Fonts match the manifest
        run: bun run verify:fonts

      # Token contrast, and the reserved use of alignment-target green. axe
      # covers rendered pages, but only once PREVIEW_URL is set.
      - name: Design tokens
        run: bun run verify:tokens

      # vercel.json is committed so redirect changes are reviewable in the
      # diff. This fails if it drifts from data/redirects.csv.
      - name: vercel.json is current
        run: node scripts/build-vercel-json.mjs --check

      - name: Build
        run: bun run build

      - name: JSON-LD validation
        run: bun run verify:jsonld

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative hrefs against the
          # built output rather than the filesystem root.
          #
          # The production origin is excluded because every absolute URL in
          # the build (canonicals, the sitemap entries) points at the site
          # this repo is replacing. Resolving them against the current
          # Webflow site checks the wrong thing and fails on pages that do
          # not exist there yet. Real URLs are verified against a real
          # deployment by scripts/verify-redirects.mjs in the job below.
          #
          # dist/fonts/OFL.txt is the font licence, which the OFL requires us to
          # distribute alongside the font. It is not site content and its body
          # text carries Adobe and SIL URLs; crawling them adds 90 seconds and a
          # third-party timeout to every run for no signal.
          args: >-
            --no-progress --include-fragments
            --root-dir "$GITHUB_WORKSPACE/dist"
            --exclude '^https://www\.eaglespancorp\.com'
            --exclude-path dist/fonts/OFL.txt
            dist
          fail: true

  deployed:
    name: Gates against the preview deployment
    runs-on: ubuntu-latest
    needs: gates
    # Redirects, Lighthouse and axe need a real origin. The deploy step is
    # wired in Phase 7 with the cutover runbook; until then these run only
    # when a preview URL is available.
    if: ${{ vars.PREVIEW_URL != '' }}
    env:
      # This project has Vercel deployment protection on, scoped
      # all_except_custom_domains, so every preview URL answers 302 to a login
      # page. This token is Vercel's documented way to let automation through:
      # a request carrying it skips the check.
      #
      # A repository *secret*, not a variable — it is a credential, and secrets
      # are masked in logs. Create it in the Vercel project under Deployment
      # Protection -> Protection Bypass for Automation. Leave it unset only if
      # PREVIEW_URL points at an origin that is not protected, such as a custom
      # domain; verify-redirects.mjs says which case it is looking at.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # One hop, correct destination, destination returns 200. Runs first
      # because it preflights the origin: if the bypass token is missing or
      # stale it says so once here, rather than letting all three gates fail
      # with login redirects that look like site bugs.
      - name: Verify redirects
        run: node scripts/verify-redirects.mjs "${{ vars.PREVIEW_URL }}"

      # The action takes no header input, but it forwards a LHCI config to
      # `lhci collect`, and LHCI passes collect.settings.extraHeaders down to
      # Lighthouse. Written at run time so the token is never in a committed
      # file, and sent as a header rather than a query parameter so it cannot
      # reach the uploaded results artifact.
      - name: Lighthouse config carrying the bypass header
        run: |
          jq -n --arg secret "$VERCEL_AUTOMATION_BYPASS_SECRET" \
            '{ci:{collect:{settings:{extraHeaders:{"x-vercel-protection-bypass":$secret}}}}}' \
            > lighthouserc.json

      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ vars.PREVIEW_URL }}/
          budgetPath: ./lighthouse-budget.json
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      # @axe-core/cli has no header option — only --chrome-options, which
      # cannot set request headers — so here the token has to go in the query
      # string. `x-vercel-set-bypass-cookie` makes Vercel reply with a cookie
      # and a redirect to the clean URL, so the page axe actually audits
      # carries no token. GitHub masks the value in the log, and this step
      # uploads nothing.
      - name: Accessibility (axe)
        run: |
          url="${{ vars.PREVIEW_URL }}/"
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            url="${url}?x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=true"
          fi
          bunx @axe-core/cli "$url" \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa

name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listening to both
  # ran every gate twice on each PR commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      # Full history. `src/lib/lastmod.ts` reads the commit that last touched
      # each content file to produce the sitemap's `lastmod`; at the default
      # depth of 1 every path reports the tip commit, so it detects the shallow
      # clone and omits the dates entirely rather than shipping the same wrong
      # one fourteen times. `verify:sitemap` then has nothing to check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Content typography lint
        run: bun run lint:typography

      # The text pipeline and the lint rules. Both are regex-heavy and both are
      # easy to break in a way no page reveals until the wrong viewport width.
      - name: Unit tests
        run: bun test

      # The woff2 files, fonts.css, the preload module and data/fonts.json all
      # have to describe the same fonts. A stale hash is a silent 404 that falls
      # back to Arial and looks fine until you look at a spec column.
      - name: Fonts match the manifest
        run: bun run verify:fonts

      # Token contrast, and the reserved use of alignment-target green. axe
      # covers rendered pages, but only once PREVIEW_URL is set.
      - name: Design tokens
        run: bun run verify:tokens

      # vercel.json is committed so redirect changes are reviewable in the
      # diff. This fails if it drifts from data/redirects.csv.
      - name: vercel.json is current
        run: node scripts/build-vercel-json.mjs --check

      # A tag with no renderer, a missing singleton, or a content file left
      # behind by a rename. The build validates the content; this validates the
      # shape around it.
      - name: Content model
        run: bun run verify:content

      - name: Build
        run: bun run build

      # Keystatic is registered for `astro dev` only, which is what makes local
      # mode safe: no admin UI and no write endpoint on a public origin. One
      # careless line makes that false without breaking anything visible.
      - name: Production build is static
        run: bun run verify:static-build

      - name: JSON-LD validation
        run: bun run verify:jsonld

      # The sitemap is written by src/pages/sitemap.xml.ts rather than by an
      # integration, which is what lets its `lastmod` come from the content and
      # from git. This is the check that replaces what the integration
      # guaranteed for free: the sitemap and the built site list the same pages.
      - name: Sitemap
        run: bun run verify:sitemap

      # The files something asks for before it asks for a page: llms.txt, the
      # icons and the robots line that points at them. llms.txt is generated
      # from the same page inventory as the sitemap, which is what makes it
      # trustworthy — this is the check that notices when it stops being.
      - name: Agent and crawler metadata
        run: bun run verify:metadata

      # Motion is opt-in and the resting state is the final frame: every
      # animation sits behind `prefers-reduced-motion: no-preference`, none of
      # them fills forwards, and the built homepage reads 0.00° without ever
      # running one. Both halves of the title morph derive their name from the
      # same function, which is the part that would otherwise rot in silence.
      - name: Motion
        run: bun run verify:motion

      # The forms are rendered from a manifest that the endpoint validates
      # against, so those two cannot drift. This is the third party: that the
      # page actually rendered the form, with a real method and action, so it
      # still submits with no JavaScript — the failure every other check misses
      # because the enhancement submits it anyway.
      - name: Forms
        run: bun run verify:forms

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative hrefs against the
          # built output rather than the filesystem root.
          #
          # --index-files is what makes that resolution agree with how the site
          # is actually served. Without it a link to a directory resolves to the
          # directory, so a fragment check looks for the anchor in dist/client
          # itself and never opens dist/client/index.html. That failed
          # `/#testimonials` — the Company menu's own destination, and a real
          # anchor on the homepage — twice on all thirty pages, because the
          # header renders the menu once for the pointer and once for narrow
          # viewports. It does not weaken the gate: a fragment that is genuinely
          # not on the page it names still fails, which is the whole reason
          # --include-fragments is on.
          #
          # The production origin is excluded because every absolute URL in
          # the build (canonicals, the sitemap entries) points at the site
          # this repo is replacing. Resolving them against the current
          # Webflow site checks the wrong thing and fails on pages that do
          # not exist there yet. Real URLs are verified against a real
          # deployment by scripts/verify-redirects.mjs in the job below.
          #
          # dist/fonts/OFL.txt is the font licence, which the OFL requires us to
          # distribute alongside the font. It is not site content and its body
          # text carries Adobe and SIL URLs; crawling them adds 90 seconds and a
          # third-party timeout to every run for no signal.
          #
          # picsum.photos serves the placeholder photography (see
          # src/lib/placeholders.ts). Every page carries several, so a run would
          # fire thirty-odd requests at one host and fail the build on its rate
          # limiter rather than on a broken link. The exclusion goes when the
          # real photographs land and the module is deleted.
          #
          # /api/contact is the action of both forms and the one on-demand route
          # the deployed site carries. The adapter bundles it into
          # .vercel/output/functions rather than emitting a file, so it cannot
          # exist under dist/client by construction — this step checks the
          # static output, not an origin, and there is nothing here for it to
          # find. Excluding it costs no coverage: verify:static-build owns the
          # invariant that matters (the routing table, so a second on-demand
          # route fails) and verify:forms already checks that both forms render
          # this action.
          args: >-
            --no-progress --include-fragments
            --root-dir "$GITHUB_WORKSPACE/dist/client"
            --index-files index.html
            --exclude '^https://www\.eaglespancorp\.com'
            --exclude '^https://(fastly\.)?picsum\.photos'
            --exclude '/api/contact$'
            --exclude-path dist/client/fonts/OFL.txt
            dist/client
          fail: true

  deployed:
    name: Gates against the preview deployment
    runs-on: ubuntu-latest
    needs: gates
    # Redirects, Lighthouse and axe need a real origin. The deploy step is
    # wired in Phase 7 with the cutover runbook; until then these run only
    # when a preview URL is available.
    if: ${{ vars.PREVIEW_URL != '' }}
    env:
      # This project has Vercel deployment protection on, scoped
      # all_except_custom_domains, so every preview URL answers 302 to a login
      # page. This token is Vercel's documented way to let automation through:
      # a request carrying it skips the check.
      #
      # A repository *secret*, not a variable — it is a credential, and secrets
      # are masked in logs. Create it in the Vercel project under Deployment
      # Protection -> Protection Bypass for Automation. Leave it unset only if
      # PREVIEW_URL points at an origin that is not protected, such as a custom
      # domain; verify-redirects.mjs says which case it is looking at.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # Full history. `src/lib/lastmod.ts` reads the commit that last touched
      # each content file to produce the sitemap's `lastmod`; at the default
      # depth of 1 every path reports the tip commit, so it detects the shallow
      # clone and omits the dates entirely rather than shipping the same wrong
      # one fourteen times. `verify:sitemap` then has nothing to check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # verify-redirects reads dist/ to tell a destination the site has not
      # built yet from one that is genuinely broken.
      - name: Build
        run: bun run build

      # One hop, correct destination, and — for destinations this build
      # actually produces — a live page. Runs first because it preflights the
      # origin: if the bypass token is missing or stale it says so once here,
      # rather than letting all three gates fail with login redirects that look
      # like site bugs.
      - name: Verify redirects
        run: node scripts/verify-redirects.mjs "${{ vars.PREVIEW_URL }}"

      # The action takes no header input, but it forwards a LHCI config to
      # `lhci collect`, and LHCI passes collect.settings.extraHeaders down to
      # Lighthouse. Written at run time so the token is never in a committed
      # file, and sent as a header rather than a query parameter so it cannot
      # reach the uploaded results artifact.
      - name: Lighthouse config carrying the bypass header
        run: |
          jq -n --arg secret "$VERCEL_AUTOMATION_BYPASS_SECRET" \
            '{ci:{collect:{settings:{extraHeaders:{"x-vercel-protection-bypass":$secret}}}}}' \
            > lighthouserc.json

      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ vars.PREVIEW_URL }}/
          budgetPath: ./lighthouse-budget.json
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      # @axe-core/cli has no header option — only --chrome-options, which
      # cannot set request headers — so here the token has to go in the query
      # string. `x-vercel-set-bypass-cookie` makes Vercel reply with a cookie
      # and a redirect to the clean URL, so the page axe actually audits
      # carries no token. GitHub masks the value in the log, and this step
      # uploads nothing.
      - name: Accessibility (axe)
        run: |
          url="${{ vars.PREVIEW_URL }}/"
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            url="${url}?x-vercel-protection-bypass=${VERCEL_AUTOMATION_BYPASS_SECRET}&x-vercel-set-bypass-cookie=true"
          fi
          bunx @axe-core/cli "$url" \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa
